name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: shellcheck + static self-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: shellcheck (errors only)
        run: |
          shellcheck -S error \
            install.sh install-offline.sh verify.sh uninstall.sh lib.sh \
            scripts/*.sh tests/run.sh

      - name: static self-check
        run: bash tests/run.sh

      - name: markdown link sanity
        run: |
          # every relative link in README must exist in the tree
          grep -oE '\]\([^)#][^)]*\)' README.md | sed 's/^](//; s/)$//' |
          while read -r l; do
            case "$l" in http*|mailto*) continue ;; esac
            [ -e "$l" ] || { echo "broken link: $l"; exit 1; }
          done
