name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: shellcheck + static self-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: shellcheck (info and above)
        run: |
          shellcheck -S info \
            install.sh install-offline.sh verify.sh uninstall.sh lib.sh \
            scripts/*.sh tests/run.sh

      - name: static self-check
        run: bash tests/run.sh

      - name: markdown link sanity
        run: bash tests/links.sh

  distro-matrix:
    name: self-check on ${{ matrix.image }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:22.04
          - ubuntu:24.04
          - debian:12
          - debian:13
    container: ${{ matrix.image }}
    steps:
      - name: base tools (checkout needs git inside the container)
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ca-certificates git bash python3 coreutils findutils grep tar >/dev/null

      - uses: actions/checkout@v4

      - name: bash version
        run: bash --version | head -1

      - name: static self-check
        run: bash tests/run.sh
